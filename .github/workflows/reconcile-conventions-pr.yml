name: Reconcile Conventions PR

on:
  push:
    branches:
      - foundation/adopt-managed-conventions

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reconcile corrected main and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/reconcile-conventions-pr.yml
          git add .github/workflows/reconcile-conventions-pr.yml
          git commit -m 'ci: remove conventions reconciliation workflow'
          git push origin HEAD:foundation/adopt-managed-conventions

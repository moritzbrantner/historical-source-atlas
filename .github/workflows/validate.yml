name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  foundation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@bde1c6cc240fe047d0718ebf2d2a78fee0bfc305
    with:
      tier: fast
      strict: true
      install_mode: auto
    secrets: inherit

  integration:
    name: Integration Validation
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration checks
        run: |
          set -euo pipefail
          bun run db:check
          ./scripts/ci/check-atlas-seed-idempotency.sh
          bun run test:integration

      - name: Upload seed service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: integration-docker-state
          path: |
            test-results
            playwright-report

  storybook:
    name: Storybook Validation
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Build Storybook
        run: bun run storybook:build

      - name: Run Storybook tests
        run: bun run test:storybook

      - name: Upload Storybook artifact
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: storybook-static
          path: storybook-static

  pages-export:
    name: GitHub Pages Export
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build GitHub Pages artifact
        env:
          NEXT_DEPLOY_TARGET: gh-pages
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:gh-pages

      - name: Verify Unlighthouse summary output
        run: |
          set -euo pipefail
          test -f .generated/unlighthouse/ci-result.json
          test -f out/en/unlighthouse/index.html
          test -f out/de/unlighthouse/index.html

  full:
    name: Full Validation
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        env:
          AUTH_SECRET: ci-build-secret-ci-build-secret
          DATABASE_URL: postgresql://atlas:atlas_password@127.0.0.1:55434/historical_source_atlas?schema=public
          SITE_URL: http://127.0.0.1:3000
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: no-reply@example.com
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          SMTP_SECURE: 'false'
          INTERNAL_CRON_SECRET: ci-cron-secret
        run: bun run build

      - name: Run e2e tests
        run: ./scripts/ci/run-e2e.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-results
          path: |
            test-results
            playwright-report

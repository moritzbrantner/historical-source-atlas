name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    outputs:
      audit: ${{ steps.scope.outputs.audit }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import json
          import os
          import re
          import subprocess

          # GitHub path filters: '*' stays within a segment; '**' crosses segments.
          def matches(path, pattern):
              parts = re.split(r"(\*\*/|\*\*|\*|\?)", pattern)
              expression = "".join({"**/": "(?:.*/)?", "**": ".*", "*": "[^/]*", "?": "[^/]"}.get(part, re.escape(part)) for part in parts)
              return re.fullmatch(expression, path) is not None

          required = False
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              paths = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]]).decode().split("\0")
              patterns = ['.github/workflows/foundation-audit.yml', '.repository-environment.toml', 'scripts/codex-environment.sh', '.coding-tooling.json', 'conventions.json', 'conventions.lock.json', '.conventions/**', 'renovate.json']
              required = any(matches(path, pattern) for path in paths for pattern in patterns)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"audit={str(required).lower()}", file=output)
              print(f"allow-skipped={json.dumps([] if required else ['foundation-audit'])}", file=output)
  foundation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@a11ca7f3feaca0936803308cf4b150b4150cb99c
    with:
      tier: fast
      strict: true
      install_mode: auto
    secrets: inherit

  integration:
    name: Integration Validation
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration checks
        run: |
          set -euo pipefail
          bun run db:check
          ./scripts/ci/check-atlas-seed-idempotency.sh
          bun run test:integration

      - name: Upload seed service logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: ignore
          name: integration-docker-state
          path: |
            test-results
            playwright-report

  storybook:
    name: Storybook Validation
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Build Storybook
        run: bun run storybook:build

      - name: Run Storybook tests
        run: bun run test:storybook

      - name: Upload Storybook artifact
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: ignore
          name: storybook-static
          path: storybook-static

  pages-export:
    name: GitHub Pages Export
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build GitHub Pages artifact
        env:
          NEXT_DEPLOY_TARGET: gh-pages
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:gh-pages

      - name: Verify Unlighthouse summary output
        run: |
          set -euo pipefail
          test -f .generated/unlighthouse/ci-result.json
          test -f out/en/unlighthouse/index.html
          test -f out/de/unlighthouse/index.html

  full:
    name: Full Validation
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        env:
          AUTH_SECRET: ci-build-secret-ci-build-secret
          DATABASE_URL: postgresql://atlas:atlas_password@127.0.0.1:55434/historical_source_atlas?schema=public
          SITE_URL: http://127.0.0.1:3000
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: no-reply@example.com
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          SMTP_SECURE: 'false'
          INTERNAL_CRON_SECRET: ci-cron-secret
        run: bun run build

      - name: Run e2e tests
        run: ./scripts/ci/run-e2e.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: ignore
          name: playwright-results
          path: |
            test-results
            playwright-report

  foundation-audit:
    needs: validation-scope
    if: needs.validation-scope.outputs.audit == 'true'
    uses: ./.github/workflows/foundation-audit.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: always()
    needs:
      [
        foundation,
        integration,
        storybook,
        pages-export,
        full,
        validation-scope,
        foundation-audit,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["foundation", "integration", "storybook", "pages-export", "full", "validation-scope", "foundation-audit"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}

name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ['Validate']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build GitHub Pages artifact
        env:
          NEXT_DEPLOY_TARGET: gh-pages
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:gh-pages

      - name: Verify Unlighthouse summary output
        run: |
          set -euo pipefail
          test -f .generated/unlighthouse/ci-result.json
          test -f out/en/unlighthouse/index.html
          test -f out/de/unlighthouse/index.html
          test -f out/en/atlas/index.html
          test -f out/de/atlas/index.html
          test -f out/en/atlas/sources/dead-sea-scrolls/index.html

      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail
          touch out/.nojekyll

          echo "Built files:"
          find out -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

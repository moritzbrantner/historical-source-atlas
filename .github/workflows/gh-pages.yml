name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ['Validate']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: historical-source-atlas

      - name: Checkout sibling maps dependency
        uses: actions/checkout@v6
        with:
          path: maps
          repository: ${{ github.repository_owner }}/maps
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Checkout sibling platform packages dependency
        uses: actions/checkout@v6
        with:
          path: platform-packages
          repository: ${{ github.repository_owner }}/platform-packages
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Checkout sibling Rust packages dependency
        uses: actions/checkout@v6
        with:
          path: rust-packages
          repository: ${{ github.repository_owner }}/rust-packages
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Checkout sibling timeline editor dependency
        uses: actions/checkout@v6
        with:
          path: timeline-editor
          repository: ${{ github.repository_owner }}/timeline-editor
          token: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: historical-source-atlas
        run: ./scripts/ci/install-with-sibling-maps.sh

      - name: Build GitHub Pages artifact
        working-directory: historical-source-atlas
        env:
          NEXT_DEPLOY_TARGET: gh-pages
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:gh-pages

      - name: Verify Unlighthouse summary output
        working-directory: historical-source-atlas
        run: |
          set -euo pipefail
          test -f .generated/unlighthouse/ci-result.json
          test -f out/en/unlighthouse/index.html
          test -f out/de/unlighthouse/index.html
          test -f out/en/atlas/index.html
          test -f out/de/atlas/index.html
          test -f out/en/atlas/sources/dead-sea-scrolls/index.html

      - name: Prepare GitHub Pages artifact
        working-directory: historical-source-atlas
        run: |
          set -euo pipefail
          touch out/.nojekyll

          echo "Built files:"
          find out -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: historical-source-atlas/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

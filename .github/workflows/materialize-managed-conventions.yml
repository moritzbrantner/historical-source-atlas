name: Materialize Managed Conventions

on:
  push:
    branches:
      - foundation/adopt-managed-conventions

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Check out coding-tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: moritzbrantner/coding-tooling
          ref: 35d32f320c84e5f2e453106c4af047377f76dd05
          path: .tooling/coding-tooling

      - name: Check out coding-agent-conventions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: fe629411fe8181217877d107b5efff700a2d8095
          path: .tooling/coding-agent-conventions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install coding-tooling dependencies
        run: cd .tooling/coding-tooling && bun install --frozen-lockfile

      - name: Materialize managed conventions
        run: |
          set -euo pipefail
          bun .tooling/coding-tooling/src/cli.ts bootstrap apply \
            --root . \
            --conventions-root .tooling/coding-agent-conventions \
            --json
          test -f conventions.json
          test -f conventions.lock.json
          test -f .conventions/index.md

      - name: Commit generated snapshot and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-managed-conventions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add conventions.json conventions.lock.json .conventions .github/workflows/materialize-managed-conventions.yml
          git diff --cached --exit-code && {
            echo 'Expected generated convention changes, but the snapshot is already current.' >&2
            exit 1
          }
          git commit -m 'foundation: adopt managed conventions snapshot'
          git push origin HEAD:foundation/adopt-managed-conventions

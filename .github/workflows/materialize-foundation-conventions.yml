name: Materialize Foundation Conventions

on:
  push:
    branches:
      - foundation/complete-environment-renovate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Check out coding-tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: moritzbrantner/coding-tooling
          ref: 35d32f320c84e5f2e453106c4af047377f76dd05
          path: .tooling/coding-tooling

      - name: Check out coding-agent-conventions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: fe629411fe8181217877d107b5efff700a2d8095
          path: .tooling/coding-agent-conventions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install coding-tooling dependencies
        run: cd .tooling/coding-tooling && bun install --frozen-lockfile

      - name: Materialize convention snapshot
        run: |
          set -euo pipefail
          bun .tooling/coding-tooling/src/cli.ts bootstrap apply \
            --root . \
            --conventions-root .tooling/coding-agent-conventions \
            --json > /tmp/bootstrap.json
          cat /tmp/bootstrap.json
          test -f conventions.json
          test -f conventions.lock.json
          test -f .conventions/index.md
          mkdir -p .artifacts/foundation-conventions
          cp conventions.json conventions.lock.json .artifacts/foundation-conventions/
          cp -R .conventions .artifacts/foundation-conventions/.conventions
          cp /tmp/bootstrap.json .artifacts/foundation-conventions/bootstrap.json

      - name: Upload generated convention snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundation-conventions
          path: .artifacts/foundation-conventions
          if-no-files-found: error
          retention-days: 1

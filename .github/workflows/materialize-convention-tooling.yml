name: Materialize Convention Tooling

on:
  push:
    branches:
      - foundation/adopt-managed-conventions

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Declare repository-owned convention tooling
        run: |
          set -euo pipefail
          bun add --dev --exact oxlint@1.80.0
          bun install --frozen-lockfile
          node -e "const p=require('./package.json'); if (p.devDependencies?.oxlint !== '1.80.0') process.exit(1)"

      - name: Commit dependency and lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-convention-tooling.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock .github/workflows/materialize-convention-tooling.yml
          git diff --cached --exit-code && {
            echo 'Expected convention-tooling changes, but repository state is already current.' >&2
            exit 1
          }
          git commit -m 'foundation: declare required convention tooling'
          git push origin HEAD:foundation/adopt-managed-conventions

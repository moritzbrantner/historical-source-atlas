name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: historical_source_atlas
          POSTGRES_PASSWORD: atlas_password
          POSTGRES_USER: atlas
        options: >-
          --health-cmd "pg_isready -U atlas -d historical_source_atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 55434:5432
    env:
      CI: true
      DATABASE_URL: postgresql://atlas:atlas_password@localhost:55434/historical_source_atlas
    defaults:
      run:
        working-directory: historical-source-atlas
    steps:
      - name: Checkout atlas
        uses: actions/checkout@v4
        with:
          path: historical-source-atlas

      - name: Checkout sibling maps dependency
        uses: actions/checkout@v4
        with:
          path: maps
          repository: ${{ github.repository_owner }}/maps
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install maps dependencies
        working-directory: maps
        run: bun install --frozen-lockfile

      - name: Install atlas dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Check types
        run: bun run check-types

      - name: Check formatting
        run: bun run format:check

      - name: Run unit tests
        run: bun run test:unit

      - name: Run DB tests
        run: bun run test:db

      - name: Build
        run: bun run build

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: historical-source-atlas/playwright-report/
          retention-days: 14
